# Deletes a test build and its tag, by hand: GitHub › Actions › delete test build › Run workflow, with its tag (v0.1.5.10).
# Only a test build: a four-part version that is a prerelease (release.yml's test builds, only testers are offered them).
# A release (three parts, v0.1.5) is never deleted here. The next test build is still numbered after the highest tag left
# (release.yml), so a deleted number is not used again while a higher one exists.
name: delete test build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'The test build to delete, e.g. v0.1.5.10'
        required: true

permissions:
  contents: write

concurrency:
  group: delete-test-build
  cancel-in-progress: false

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the release and its tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$TAG is not a test build (four parts, like v0.1.5.10): releases are never deleted here"
            exit 1
          fi
          pre=$(gh release view "$TAG" --repo "$REPO" --json isPrerelease --jq .isPrerelease)
          if [ "$pre" != "true" ]; then
            echo "::error::$TAG is not a prerelease: not deleted"
            exit 1
          fi
          gh release delete "$TAG" --repo "$REPO" --cleanup-tag --yes
          echo "Deleted the test build $TAG and its tag." >> "$GITHUB_STEP_SUMMARY"
