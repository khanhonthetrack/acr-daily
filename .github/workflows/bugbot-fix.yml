# The bug bot, steps 2 and 3: started by bugbot-intake for each new, clear bug (workflow_dispatch), or by hand with
# the `ai-fix` label on any open issue (only people with write access can label) ->
#   fix     Claude edits a checkout (no GitHub write token anywhere near it) and runs the unit tests;
#   pr      the edits become a draft PR "Fixes #N" on bugbot/issue-N (changes to .github/ or tools/bugbot/ refused);
#   test    the app's and server's unit tests on Windows, as the release build runs them;
#   review  Claude reviews the diff + test log (read-only), the review goes on the PR as a comment.
# Nothing merges: that stays a person's job. tools/bugbot/README.md
name: bugbot-fix

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number to fix'
        required: true

concurrency:
  group: bugbot-fix-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fix:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'ai-fix' && github.event.issue.state == 'open')
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up
        shell: bash
        run: |
          python -m pip install --quiet pillow==12.3.0
          (cd server && npm ci)
          npm install -g @anthropic-ai/claude-code@^2.1
          mkdir -p .bugbot "$RUNNER_TEMP/appdata"

      - name: Claude fixes the issue
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}          # (read-only here; bugbot.py keeps it from Claude)
          GITHUB_REPOSITORY: ${{ github.repository }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BUGBOT_MODEL: ${{ vars.BUGBOT_MODEL || 'claude-opus-5-5' }}
          APPDATA: ${{ runner.temp }}/appdata        # (the app's tests never touch a real settings folder)
        run: python tools/bugbot/bugbot.py fix --issue ${{ github.event.issue.number || inputs.issue }} --out .bugbot/fix.json

      - name: Pack the change
        shell: bash
        run: |
          git add -A -- . ':!.bugbot'
          git diff --cached --binary > .bugbot/fix.patch
          git diff --cached --stat
          if git diff --cached --name-only | grep -E '^(\.github/|tools/bugbot/)'; then
            echo "the change touches .github/ or tools/bugbot/: refused" >> .bugbot/refused.txt
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: bugbot-fix
          path: .bugbot/
          include-hidden-files: true

  pr:
    needs: fix
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
      branch: ${{ steps.pr.outputs.branch }}
    env:
      GH_TOKEN: ${{ github.token }}
      N: ${{ github.event.issue.number || inputs.issue }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v5
        with:
          name: bugbot-fix
          path: .bugbot

      - name: Draft PR
        id: pr
        run: |
          fixed=$(python3 -c "import json;print(json.load(open('.bugbot/fix.json'))['fixed'])")
          if [ -s .bugbot/refused.txt ] || [ "$fixed" != "True" ] || [ ! -s .bugbot/fix.patch ]; then
            why=$(python3 -c "import json;f=json.load(open('.bugbot/fix.json'));print(f['why_not'] or f['cause'])")
            [ -s .bugbot/refused.txt ] && why="$(cat .bugbot/refused.txt)"
            gh issue comment "$N" --body "The bug bot made no fix.

          $why"
            gh issue edit "$N" --remove-label ai-fix || true
            exit 0
          fi
          branch="bugbot/issue-$N"
          git config user.name "ACR Daily bug bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git apply --index .bugbot/fix.patch
          title=$(python3 -c "import json;print(json.load(open('.bugbot/fix.json'))['pr_title'])")
          git commit -m "$title" -m "Fixes #$N (written by the bug bot)"
          git push --force origin "$branch"
          python3 tools/bugbot/bugbot.py pr-body --issue "$N" > .bugbot/pr.md
          url=$(gh pr list --head "$branch" --json url --jq '.[0].url')
          if [ -z "$url" ]; then
            url=$(gh pr create --draft --head "$branch" --title "$title" --body-file .bugbot/pr.md --label bugbot)
          else
            gh pr edit "$url" --title "$title" --body-file .bugbot/pr.md
          fi
          echo "pr=$(basename "$url")" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          gh issue comment "$N" --body "The bug bot opened a draft fix: $url (tests and an AI review follow)."

  test:
    needs: pr
    if: needs.pr.outputs.pr != ''
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      ok: ${{ steps.t.outputs.ok }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.pr.outputs.branch }}
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Unit tests
        id: t
        shell: pwsh
        env:
          APPDATA: ${{ runner.temp }}\appdata
        run: |
          New-Item -ItemType Directory -Force $env:APPDATA | Out-Null
          python -m pip install --quiet pillow==12.3.0
          $ok = $true
          Push-Location client; python -m unittest discover -s tests *> ../tests.txt; if ($LASTEXITCODE) { $ok = $false }; Pop-Location
          Push-Location server; npm ci *> $null; npm test *>> ../tests.txt; if ($LASTEXITCODE) { $ok = $false }; Pop-Location
          "ok=$($ok.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Get-Content tests.txt -Tail 40

      - uses: actions/upload-artifact@v5
        with:
          name: bugbot-tests
          path: tests.txt

  review:
    needs: [pr, test]
    if: needs.pr.outputs.pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
      pull-requests: write
    env:
      N: ${{ github.event.issue.number || inputs.issue }}
      PR: ${{ needs.pr.outputs.pr }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.pr.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: actions/download-artifact@v5
        with:
          name: bugbot-tests
          path: .bugbot

      - name: Claude reviews
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BUGBOT_MODEL: ${{ vars.BUGBOT_MODEL || 'claude-opus-5-5' }}
        run: |
          npm install -g @anthropic-ai/claude-code@^2.1
          git diff origin/main...HEAD > .bugbot/pr.diff
          python3 tools/bugbot/bugbot.py review --issue "$N" --pr "$PR" --diff .bugbot/pr.diff --tests .bugbot/tests.txt --out .bugbot/review.json

      - name: Post the review
        env:
          GH_TOKEN: ${{ github.token }}
          OK: ${{ needs.test.outputs.ok }}
        run: |
          python3 tools/bugbot/bugbot.py review-comment --tests-ok "${OK:-false}" > .bugbot/review.md
          gh pr comment "$PR" --body-file .bugbot/review.md
          if [ "$OK" = "true" ]; then gh pr edit "$PR" --add-label tests-passed; else gh pr edit "$PR" --add-label tests-failed; fi
          if grep -q "Check in the game" .bugbot/review.md; then gh pr edit "$PR" --add-label needs-in-game-test; fi
          verdict=$(python3 -c "import json;print(json.load(open('.bugbot/review.json'))['verdict'])")
          if [ "$verdict" = "looks-good" ] && [ "$OK" = "true" ]; then gh pr ready "$PR"; fi
