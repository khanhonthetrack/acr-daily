# Builds ACR-Daily.exe on GitHub's own Windows machines from the tagged commit, signs a build attestation
# (which file, from which commit, by which workflow) and publishes both on a GitHub Release.
# The website's download and the app's UPDATE button use that release file, so anyone can check it with
#   gh attestation verify ACR-Daily.exe --repo khanhonthetrack/acr-daily
# Release: set __version__ in client/acr_daily/__init__.py and add that version's entry at the top of
# server/src/changelog.js (what's new, for drivers: it goes on the release, the website's /changelog, Discord's
# #changelog and the app's WHAT'S NEW screen; no entry, no release), commit, then push a tag v<version>. Or, with that commit on
# main, run this workflow by hand on main (Actions > release > Run workflow): it releases the version __init__.py says
# and the release makes its tag on that commit.
# A test build (`test`: dev.yml on each change of the app on main, or by hand): numbered after the last release, the next
# free one (v0.1.5 released: 0.1.5.4 after 0.1.5.3), written into __init__.py for this build only, published as a
# prerelease. Its what's new is the release it leads to (server/src/changelog.js entryForBuild); testers' apps find it
# on GitHub (client/acr_daily/updater.py latest_test_build), nobody else is offered it.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      test:
        description: 'A test build for the testers (numbered after the last release), not a release'
        type: boolean
        default: false
  workflow_call:
    inputs:
      test:
        type: boolean
        default: true

permissions:
  contents: write       # create the release
  id-token: write       # sign the attestation (Sigstore)
  attestations: write   # store it on GitHub

env:
  SERVER_URL: https://acrdaily.com
  PYINSTALLER_VERSION: '6.22.3'
  PILLOW_VERSION: '12.3.0'      # Steam avatars (JPEG) on the overlays
  # 7-Zip 24.09 (Igor Pavlov: GNU LGPL with the unRAR restriction), pinned by its SHA-256: its 7z.exe and 7z.dll go into
  # the app, which unpacks .rar (RAR5) and .7z liveries with them on any Windows (client liveries.to_zip)
  SEVENZIP_URL: 'https://github.com/ip7z/7zip/releases/download/24.09/7z2409-x64.msi'
  SEVENZIP_SHA256: 'ec6af1ea0367d16dde6639a89a080a524cebc4d4bedfe00ed0cac4b865a918d8'
  TRUSTSTORE_VERSION: '0.10.4'  # the server's certificate checked by Windows, like the browser does

# The actions: their majors on Node 24 (GitHub retires Node 20 on its runners).
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: A test build's number
        if: ${{ inputs.test }}
        shell: pwsh
        run: |
          # after the release out now (the server's LATEST_VERSION: not the highest tag, the numbers started again at 0.0.x
          # after v0.15.1), the next free fourth number; this build's own, not committed
          git fetch --tags --quiet origin
          $m = Select-String -Path server/wrangler.toml -Pattern '^LATEST_VERSION\s*=\s*"(\d+\.\d+\.\d+)"'
          if (-not $m) { throw 'no LATEST_VERSION in server/wrangler.toml to number a test build after' }
          $rel = 'v' + $m.Matches[0].Groups[1].Value
          $n = (git tag -l "$rel.*" | Where-Object { $_ -match '^v\d+\.\d+\.\d+\.\d+$' } |
                ForEach-Object { [int]($_.Split('.')[3]) } | Measure-Object -Maximum).Maximum
          $v = "$($rel.Substring(1)).$([int]$n + 1)"
          $f = 'client/acr_daily/__init__.py'
          $text = [IO.File]::ReadAllText("$PWD/$f") -replace "__version__ = '[\d.]+'", "__version__ = '$v'"
          [IO.File]::WriteAllText("$PWD/$f", $text)
          "Test build $v (after $rel, from $env:GITHUB_SHA)" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'   # the server's tests use node:sqlite (test/faked1.mjs)

      - name: Tag matches the app version
        shell: pwsh
        env:
          TEST_BUILD: ${{ inputs.test }}
        run: |
          $v = (Select-String -Path client/acr_daily/__init__.py -Pattern "__version__ = '([\d.]+)'").Matches[0].Groups[1].Value
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -or $env:TEST_BUILD -eq 'true') {
            # by hand: main only (a test build, a four-part version like 0.1.5.1: any branch), and a version not released
            # yet (its tag is made with the release, below)
            $test = $v -match '^\d+\.\d+\.\d+\.\d+$'
            if ($env:GITHUB_REF_NAME -ne 'main' -and -not $test) { throw "run it on main, not $env:GITHUB_REF_NAME (or set a test version, 0.1.5.1)" }
            if (git ls-remote --tags origin "refs/tags/v$v") { throw "v$v is released already: set the new version first" }
            "TAG=v$v" >> $env:GITHUB_ENV
          } else {
            if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME but the app says $v" }
            "TAG=$env:GITHUB_REF_NAME" >> $env:GITHUB_ENV
          }

      - name: Changelog entry for this version
        shell: pwsh
        run: |
          # what's new, for the release's notes (and the website and Discord, once LATEST_VERSION is this version)
          $v = $env:TAG.Substring(1)
          node server/scripts/whatsnew.mjs $v "$env:RUNNER_TEMP/whatsnew.md"
          if ($LASTEXITCODE) { exit 1 }
          Get-Content "$env:RUNNER_TEMP/whatsnew.md" -Raw -Encoding utf8 | Tee-Object -Append $env:GITHUB_STEP_SUMMARY

      - name: 7-Zip for the liveries (.rar, .7z)
        shell: pwsh
        run: |
          $msi = "$env:RUNNER_TEMP\7z.msi"
          Invoke-WebRequest -Uri $env:SEVENZIP_URL -OutFile $msi
          $h = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $env:SEVENZIP_SHA256) { throw "7-Zip: unexpected SHA-256 $h" }
          $out = "$env:RUNNER_TEMP\7zx"
          Start-Process msiexec.exe -ArgumentList '/a', "`"$msi`"", '/qn', "TARGETDIR=`"$out`"" -Wait -NoNewWindow
          $src = Get-ChildItem -Path $out -Recurse -Filter 7z.exe | Select-Object -First 1
          if (-not $src) { throw '7-Zip: no 7z.exe in the package' }
          $dst = 'client/acr_daily/7zip'
          New-Item -ItemType Directory -Force $dst | Out-Null
          foreach ($f in '7z.exe', '7z.dll', 'License.txt') { Copy-Item (Join-Path $src.DirectoryName $f) $dst }
          # it reads RAR5 (ModsCloud's liveries): said by its own list of formats
          $formats = & "$dst\7z.exe" i | Out-String
          if ($formats -notmatch 'Rar5') { throw '7-Zip: no Rar5 in its formats' }
          "7-Zip 24.09 bundled (SHA-256 $h)" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY

      - name: Tests
        shell: pwsh
        run: |
          python -m pip install --quiet pillow==$env:PILLOW_VERSION   # (the app's picture tests need it, as its build does)
          # each failing test also an annotation (its name, its last lines): the run's page shows them to anyone, the log
          # only to who is signed in
          function Note($title, $lines) {
            $t = $title -replace '%', '%25' -replace ':', '%3A' -replace ',', '%2C'
            $m = (($lines | Select-Object -Last 10) -join "`n") -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A'
            Write-Output "::error title=$t::$m"
          }
          cd client
          python -m unittest discover -s tests 2> "$env:RUNNER_TEMP/app-tests.txt"; $code = $LASTEXITCODE
          Get-Content "$env:RUNNER_TEMP/app-tests.txt"
          if ($code) {
            $out = Get-Content "$env:RUNNER_TEMP/app-tests.txt" -Raw
            foreach ($b in (($out -split '(?m)^={20,}\s*$') | Where-Object { $_ -match '(?m)^(FAIL|ERROR): ' } | Select-Object -First 8)) {
              $lines = @(($b.Trim() -split '\r?\n') | Where-Object { $_ -notmatch '^-{20,}\s*$' })
              Note $lines[0] ($lines | Select-Object -Skip 1)
            }
            exit 1
          }
          cd ../server; npm ci
          npm test 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/server-tests.txt"; $code = $LASTEXITCODE
          if ($code) {
            $fails = @(Get-Content "$env:RUNNER_TEMP/server-tests.txt" | Select-String -Pattern '^\s*(✖|not ok)' | ForEach-Object { $_.Line.Trim() } | Select-Object -Unique -First 8)
            foreach ($f in $fails) { Note 'server test' @($f) }
            exit 1
          }

      - name: Build
        shell: cmd
        run: |
          python -m pip install --quiet pyinstaller==%PYINSTALLER_VERSION% pillow==%PILLOW_VERSION% truststore==%TRUSTSTORE_VERSION%
          cd client && call build.bat %SERVER_URL%

      # Authenticode (tools/signing/sign.ps1): with the certificate in the secrets SIGN_PFX_BASE64 / SIGN_PFX_PASSWORD,
      # skipped without them. The one-file exe here; the installed app's exe and the installer in the next step.
      - name: Sign the app
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: ./tools/signing/sign.ps1 client/dist/ACR-Daily.exe

      # The installer (the user, 24 Nov 2026: fewer antivirus false alarms, "an installer ... ask to make a desktop copy",
      # "the end product should be a zip"): the app as a folder (build_folder.bat: one-dir, no UPX) installed by Inno
      # Setup into the player's own programs folder (client/installer.iss), and a zip holding the installer and a README.
      # The one-file exe stays on the release: the apps out there update from it (updater.py); installed ones from
      # ACR-Daily-Setup.exe.
      - name: Build the installer
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          cd client
          cmd /c "build_folder.bat $env:SERVER_URL"
          if ($LASTEXITCODE) { throw 'build_folder.bat failed' }
          ../tools/signing/sign.ps1 dist/ACR-Daily/ACR-Daily.exe
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y | Out-Null
            $env:Path += ';C:\Program Files (x86)\Inno Setup 6'
          }
          $v = $env:TAG.Substring(1)
          iscc /Q "/DMyAppVersion=$v" installer.iss
          if ($LASTEXITCODE) { throw 'iscc failed' }
          ../tools/signing/sign.ps1 dist/ACR-Daily-Setup.exe
          $zipDir = "$env:RUNNER_TEMP/zip"; New-Item -ItemType Directory -Force $zipDir | Out-Null
          Copy-Item dist/ACR-Daily-Setup.exe $zipDir
          $readme = @(
            "ACR Daily $v", '',
            '1. Run ACR-Daily-Setup.exe. It installs ACR Daily for you alone (no administrator), adds it to the Start menu',
            '   and, if you tick it, puts a shortcut on the desktop. Uninstall it from Windows Settings > Apps.',
            '2. Start ACR Daily, sign in with Steam, DRIVE.', '',
            'Windows SmartScreen may say "Windows protected your PC" for a program it has not seen often yet:',
            'More info > Run anyway. ACR Daily is open source (MIT): https://github.com/' + $env:GITHUB_REPOSITORY,
            'Check the file: certutil -hashfile ACR-Daily-Setup.exe SHA256 prints the SHA-256 on the release page.',
            'https://acrdaily.com')
          Set-Content -Encoding utf8 "$zipDir/README.txt" $readme
          Compress-Archive -Path "$zipDir/*" -DestinationPath "dist/ACR-Daily-$v.zip" -CompressionLevel Optimal -Force

      - name: Checksum
        shell: pwsh
        run: |
          $v = $env:TAG.Substring(1)
          foreach ($f in 'ACR-Daily.exe', 'ACR-Daily-Setup.exe', "ACR-Daily-$v.zip") {
            $h = (Get-FileHash "client/dist/$f" -Algorithm SHA256).Hash.ToLower()
            [IO.File]::WriteAllText("$PWD/client/dist/$f.sha256", $h)
            "SHA-256 $($f): $h" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          }

      - name: Build attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            client/dist/ACR-Daily.exe
            client/dist/ACR-Daily-Setup.exe
            client/dist/ACR-Daily-*.zip

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $h = Get-Content client/dist/ACR-Daily.exe.sha256
          $whatsnew = Get-Content "$env:RUNNER_TEMP/whatsnew.md" -Raw -Encoding utf8
          $notes = @"
          $whatsnew
          ---

          Built by GitHub Actions from commit $env:GITHUB_SHA ([build log]($env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID)).

          **SHA-256** ``$h``

          Check your download:
          - ``certutil -hashfile ACR-Daily.exe SHA256`` must print the hash above;
          - ``gh attestation verify ACR-Daily.exe --repo $env:GITHUB_REPOSITORY`` proves this exact file was built here from this repository.
          "@
          # (the UE4SS zip too: the app downloads it from here when ghost cars go on, client/acr_daily/modinstall.py)
          $ue4ss = Get-ChildItem mod/ue4ss/UE4SS_*.zip | Select-Object -First 1 -ExpandProperty FullName
          # a test build (a four-part version, v0.1.5.1): a prerelease, never GitHub's "latest". Nobody is offered it either way:
          # the website's download and the apps' UPDATE follow LATEST_VERSION (server/wrangler.toml), not GitHub
          $title = "ACR Daily $env:TAG"
          $flags = @()
          if ($env:TAG -match '^v\d+\.\d+\.\d+\.\d+$') { $title += ' (test build)'; $flags = @('--prerelease', '--latest=false') }
          $v = $env:TAG.Substring(1)
          gh release create $env:TAG client/dist/ACR-Daily.exe client/dist/ACR-Daily.exe.sha256 `
            client/dist/ACR-Daily-Setup.exe client/dist/ACR-Daily-Setup.exe.sha256 `
            "client/dist/ACR-Daily-$v.zip" "client/dist/ACR-Daily-$v.zip.sha256" $ue4ss --title $title --target $env:GITHUB_SHA --notes $notes @flags
