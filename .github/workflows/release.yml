# Builds ACR-Daily.exe on GitHub's own Windows machines from the tagged commit, signs a build attestation
# (which file, from which commit, by which workflow) and publishes both on a GitHub Release.
# The website's download and the app's UPDATE button use that release file, so anyone can check it with
#   gh attestation verify ACR-Daily.exe --repo khanhonthetrack/acr-daily
# Release: set __version__ in client/acr_daily/__init__.py, commit, then push a tag v<version>. Or, with that commit on
# main, run this workflow by hand on main (Actions > release > Run workflow): it releases the version __init__.py says
# and the release makes its tag on that commit.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write       # create the release
  id-token: write       # sign the attestation (Sigstore)
  attestations: write   # store it on GitHub

env:
  SERVER_URL: https://acr-daily.acr-daily-server.workers.dev
  PYINSTALLER_VERSION: '6.22.3'
  PILLOW_VERSION: '12.3.0'      # Steam avatars (JPEG) on the overlays
  TRUSTSTORE_VERSION: '0.10.4'  # the server's certificate checked by Windows, like the browser does

# The actions: their majors on Node 24 (GitHub retires Node 20 on its runners).
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'   # the server's tests use node:sqlite (test/faked1.mjs)

      - name: Tag matches the app version
        shell: pwsh
        run: |
          $v = (Select-String -Path client/acr_daily/__init__.py -Pattern "__version__ = '([\d.]+)'").Matches[0].Groups[1].Value
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            # by hand: main only, and a version not released yet (its tag is made with the release, below)
            if ($env:GITHUB_REF_NAME -ne 'main') { throw "run it on main, not $env:GITHUB_REF_NAME" }
            if (git ls-remote --tags origin "refs/tags/v$v") { throw "v$v is released already: set the new version first" }
            "TAG=v$v" >> $env:GITHUB_ENV
          } else {
            if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME but the app says $v" }
            "TAG=$env:GITHUB_REF_NAME" >> $env:GITHUB_ENV
          }

      - name: Tests
        shell: pwsh
        run: |
          python -m pip install --quiet pillow==$env:PILLOW_VERSION   # (the app's picture tests need it, as its build does)
          cd client; python -m unittest discover -s tests; if ($LASTEXITCODE) { exit 1 }
          cd ../server; npm ci; npm test

      - name: Build
        shell: cmd
        run: |
          python -m pip install --quiet pyinstaller==%PYINSTALLER_VERSION% pillow==%PILLOW_VERSION% truststore==%TRUSTSTORE_VERSION%
          cd client && call build.bat %SERVER_URL%

      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash client/dist/ACR-Daily.exe -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD/client/dist/ACR-Daily.exe.sha256", $h)
          "SHA-256: $h" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY

      - name: Build attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: client/dist/ACR-Daily.exe

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $h = Get-Content client/dist/ACR-Daily.exe.sha256
          $notes = @"
          Built by GitHub Actions from commit $env:GITHUB_SHA ([build log]($env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID)).

          **SHA-256** ``$h``

          Check your download:
          - ``certutil -hashfile ACR-Daily.exe SHA256`` must print the hash above;
          - ``gh attestation verify ACR-Daily.exe --repo $env:GITHUB_REPOSITORY`` proves this exact file was built here from this repository.
          "@
          gh release create $env:TAG client/dist/ACR-Daily.exe client/dist/ACR-Daily.exe.sha256 --title "ACR Daily $env:TAG" --target $env:GITHUB_SHA --notes $notes
