<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#000}
.tile{width:640px;height:360px;position:relative;overflow:hidden}
.tile .bg{position:absolute;inset:-40px;filter:blur(28px)}
.tile .lines{position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,transparent 2px 22px)}
.tile .shade{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,transparent 30%,rgba(0,0,0,.55) 100%)}
.tile img{position:absolute;left:50%;top:50%;width:560px;transform:translate(-50%,-50%);filter:drop-shadow(0 10px 18px rgba(0,0,0,.55))}
</style></head><body>
<div class="tile" id="rally2"><div class="bg" style="background:radial-gradient(circle at 25% 30%,#2A7BFF,transparent 55%),radial-gradient(circle at 80% 75%,#00E0FF,transparent 50%),radial-gradient(circle at 75% 20%,#C6FF1A33,transparent 40%),#0A1433"></div><div class="lines"></div><div class="shade"></div><img src="rally2-logo.png"></div>
<div class="tile" id="junior"><div class="bg" style="background:radial-gradient(circle at 25% 35%,#FFB800,transparent 55%),radial-gradient(circle at 80% 70%,#FF2D87,transparent 50%),radial-gradient(circle at 70% 20%,#FF6A00,transparent 45%),#3B0F5C"></div><div class="lines"></div><div class="shade"></div><img src="junior-logo.png"></div>
<div class="tile" id="classic"><div class="bg" style="background:radial-gradient(circle at 20% 70%,#E85D04,transparent 55%),radial-gradient(circle at 80% 30%,#FFBA08,transparent 50%),radial-gradient(circle at 60% 90%,#9D0208,transparent 45%),#2B1608"></div><div class="lines"></div><div class="shade"></div><img src="classic-logo.png"></div>
<div class="tile" id="sixties"><div class="bg" style="background:radial-gradient(circle at 25% 35%,#0B5D3B,transparent 55%),radial-gradient(circle at 80% 70%,#C9A227,transparent 45%),radial-gradient(circle at 70% 15%,#B3121F,transparent 40%),#061F14"></div><div class="lines"></div><div class="shade"></div><img src="sixties-logo.png"></div>
</body></html>
