<!-- 1. RALLY2: a slanted plate, electric blue, three speed bars -->
<div class="logo" id="rally2"><svg width="560" height="300" viewBox="0 0 560 300">
 <defs><linearGradient id="r2g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2A7BFF"/><stop offset="1" stop-color="#0B2E8A"/></linearGradient></defs>
 <g transform="skewX(-12) translate(40,0)">
  <rect x="20" y="40" width="470" height="220" rx="18" fill="#F5F8FF"/>
  <rect x="30" y="50" width="450" height="200" rx="12" fill="#0A1433"/>
  <rect x="30" y="150" width="450" height="100" rx="0" fill="url(#r2g)"/>
  <rect x="30" y="236" width="450" height="14" fill="#00E0FF"/>
  <g fill="#C6FF1A"><rect x="56" y="66" width="18" height="70"/><rect x="82" y="66" width="18" height="70" fill="#00E0FF"/><rect x="108" y="66" width="18" height="70" fill="#2A7BFF"/></g>
 </g>
 <text x="318" y="132" text-anchor="middle" font-family="Kanit" font-style="italic" font-weight="900" font-size="92" fill="#FFFFFF" letter-spacing="-1">RALLY2</text>
 <text x="282" y="212" text-anchor="middle" font-family="Russo One" font-size="34" fill="#FFFFFF" letter-spacing="3">CHAMPIONSHIP</text>
</svg></div>

 <path d="M60 170 Q280 90 500 170" stroke="#FF6A00" stroke-width="10" fill="none" opacity=".55"/>
 <!-- the car -->
 <g transform="translate(212,22)">
  <path d="M8 62 L18 44 Q26 30 44 28 L92 26 Q110 26 120 40 L132 52 Q142 54 142 64 L142 72 L8 72 Z" fill="#FF2D87" stroke="#3B0F5C" stroke-width="5" stroke-linejoin="round"/>

 </g>
 <text x="280" y="186" text-anchor="middle" font-family="Bungee" font-size="78" fill="#FFFFFF" stroke="#3B0F5C" stroke-width="10" paint-order="stroke" letter-spacing="1">RALLY4</text>
 <text x="280" y="240" text-anchor="middle" font-family="Racing Sans One" font-size="44" fill="#5B1E8C" letter-spacing="3">JUNIOR CUP</text>
</svg></div>

   <rect x="-60" y="178" width="700" height="22" fill="#FFBA08"/>
