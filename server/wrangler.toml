name = "acr-daily"
main = "src/index.js"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "acr-daily"
database_id = "a2f7071d-d7d1-489c-a10b-81708e724103"   # the official server's; use your own from `wrangler d1 create`

# Every minute: the Discord bot (src/discord.js; does nothing until DISCORD_WEBHOOK_URL is set).
[triggers]
crons = ["* * * * *"]

[vars]
# The app version people get. Bump it only once GitHub has published that release (see SETUP.md).
LATEST_VERSION = "0.14.19"
# The oldest app whose runs, live positions and routes the server takes (older ones get 426 and their UPDATE bar),
# for the dailies from MIN_APP_FROM on: a day already under way keeps the apps it started with.
MIN_APP_VERSION = "0.14.2"
MIN_APP_FROM = "2026-10-06"
# The app download: the GitHub Release built by .github/workflows/release.yml ({version} = LATEST_VERSION).
DOWNLOAD_URL = "https://github.com/khanhonthetrack/acr-daily/releases/download/v{version}/ACR-Daily.exe"
# The source code (the website links to it as "Open source"). Leave empty to hide the link.
SOURCE_URL = "https://github.com/khanhonthetrack/acr-daily"
# The community's Discord invite (https://discord.gg/...; one that never expires). The website links to it and the
# app's Discord link goes through /discord. Empty = no Discord links.
DISCORD_URL = "https://discord.gg/6kq6h6FVGb"
# The Discord server's id: with its widget on (Server Settings > Widget, invite channel set), /discord hands out the
# widget's invite, which names nobody; DISCORD_URL is the fallback.
DISCORD_GUILD_ID = "1556808894205141145"
# The website's address, for links in the Discord bot's posts (cron runs have no request to take it from).
SITE_URL = "https://acr-daily.acr-daily-server.workers.dev"

# Secrets (set with `npx wrangler secret put NAME`, never put them in this file):
#   ADMIN_KEY            long random string; the admin endpoints and the app's "Upload route" use it
#   STEAM_API_KEY        optional, https://steamcommunity.com/dev/apikey (better names/avatars)
#   ANTHROPIC_API_KEY    optional, the website's live commentary written by Claude
#   DISCORD_WEBHOOK_URL  optional, the Discord bot: a webhook of the channel it posts in (#live-timing)
