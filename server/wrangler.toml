name = "acr-daily"
main = "src/index.js"
compatibility_date = "2026-09-01"

# server\public is served as static files (the app download: /download/ACR-Daily.exe)
[assets]
directory = "./public"

[[d1_databases]]
binding = "DB"
database_name = "acr-daily"
database_id = "a2f7071d-d7d1-489c-a10b-81708e724103"   # the official server's; use your own from `wrangler d1 create`

[vars]
LATEST_VERSION = "0.12.0"
# Where people download the app. Shown on the website. (Copied there by client\build.bat.)
DOWNLOAD_URL = "/download/ACR-Daily.exe"
# The source code (the website links to it as "Open source"). Leave empty to hide the link.
SOURCE_URL = ""

# Secrets (set with `npx wrangler secret put NAME`, never put them in this file):
#   ADMIN_KEY      long random string; the admin endpoints and the app's "Upload route" use it
#   STEAM_API_KEY  optional, https://steamcommunity.com/dev/apikey (better names/avatars)
