name = "acr-daily"
main = "src/index.js"
compatibility_date = "2026-09-01"
# The website's address (the acrdaily.com zone is on Cloudflare: the deploy keeps the domain on this Worker).
routes = [{ pattern = "acrdaily.com", custom_domain = true }]
# The workers.dev address stays on too: the apps (built with SERVER_URL in .github/workflows/release.yml) use it.
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "acr-daily"
database_id = "a2f7071d-d7d1-489c-a10b-81708e724103"   # the official server's; use your own from `wrangler d1 create`

# Run traces (src/traces.js), gzipped, one object per finished run. Off until R2 is switched on for the account
# (Cloudflare dashboard > R2 Object Storage). Then: `npx wrangler r2 bucket create acr-daily-traces`, remove the # in
# front of the three lines below, `npx wrangler deploy`, and `python tools/admin.py move-traces` once.
# Until then the traces stay in the database, as before.
# [[r2_buckets]]
# binding = "TRACES"
# bucket_name = "acr-daily-traces"

# Every minute: the Discord bot (src/discord.js; does nothing until DISCORD_WEBHOOK_URL is set).
[triggers]
crons = ["* * * * *"]

[vars]
# The app version people get. Bump it only once GitHub has published that release (see SETUP.md).
LATEST_VERSION = "0.0.3"
# The oldest app whose runs, live positions and routes the server takes (older ones get 426 and their UPDATE bar),
# for the dailies from MIN_APP_FROM on: a day already under way keeps the apps it started with.
MIN_APP_VERSION = "0.0.4"
MIN_APP_FROM = "2026-10-09"
# From this daily on (YYYY-MM-DD), each daily is a one-stage Rally Weekend in the game, and the game's own stage time +
# penalty is the board time (src/index.js WEEKEND_RULES). Empty = Single Rally Stage, timed by the app (+60 s a reset).
# Switch it on with MIN_APP_VERSION = the first app that does Rally Weekends and MIN_APP_FROM = the same day.
OFFICIAL_FROM = "2026-10-09"
# The app download: the GitHub Release built by .github/workflows/release.yml ({version} = LATEST_VERSION).
DOWNLOAD_URL = "https://github.com/khanhonthetrack/acr-daily/releases/download/v{version}/ACR-Daily.exe"
# The source code (the website links to it as "Open source"). Leave empty to hide the link.
SOURCE_URL = "https://github.com/khanhonthetrack/acr-daily"
# The community's Discord invite (https://discord.gg/...; one that never expires). The website links to it and the
# app's Discord link goes through /discord. Empty = no Discord links.
DISCORD_URL = "https://discord.gg/6kq6h6FVGb"
# The Discord server's id: with its widget on (Server Settings > Widget, invite channel set), /discord hands out the
# widget's invite, which names nobody; DISCORD_URL is the fallback.
DISCORD_GUILD_ID = "1556808894205141145"
# How often the app (from 0.15.1) and the website talk to the server, in seconds. The free plan allows 100,000 requests
# a day; a driver on stage sends one every LIVE_SEND_S. Raise these if the daily count gets close (Cloudflare dashboard >
# Workers > acr-daily > Metrics), then `npx wrangler deploy`: the apps pick them up within 10 minutes.
LIVE_SEND_S = "5"     # the app's own position while on stage (it gets the other drivers back in the same request)
LIVE_POLL_S = "5"     # the other drivers' positions, while on a daily's start line or results (and the website's map)
LIVE_IDLE_S = "15"    # ... anywhere else (the app's displays with "only on the daily" off; the website with nobody on stage)
BOARD_S = "120"       # today's boards, while the game is running
BOARD_IDLE_S = "300"  # ... while it is not
# The website's address, for links in the Discord bot's posts (cron runs have no request to take it from).
SITE_URL = "https://acrdaily.com"

# Secrets (set with `npx wrangler secret put NAME`, never put them in this file):
#   ADMIN_KEY            long random string; the admin endpoints and the app's "Upload route" use it
#   STEAM_API_KEY        optional, https://steamcommunity.com/dev/apikey (better names/avatars)
#   DISCORD_WEBHOOK_URL  optional, the Discord bot: a webhook of the channel it posts in (#live-timing)
